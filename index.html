<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>International Student Administrative Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">IS</span>
          <div>
            <strong>Student Admin</strong>
            <span>ESCP Business School</span>
          </div>
        </div>
        <nav class="nav-list">
          <button class="nav-item active" data-route="personal" type="button">
            <span aria-hidden="true">01</span>
            Onboarding
          </button>
          <button class="nav-item" data-route="upload" type="button">
            <span aria-hidden="true">02</span>
            Documents
          </button>
          <button class="nav-item" data-route="resources" type="button">
            <span aria-hidden="true">03</span>
            Next Steps
          </button>
          <button class="nav-item" data-route="help" type="button">
            <span aria-hidden="true">04</span>
            Support
          </button>
        </nav>
        <div class="language-switcher" aria-label="Language selector">
          <button class="chip active" type="button">EN</button>
          <button class="chip" type="button">FR</button>
          <button class="chip" type="button">ES</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">International Student Administrative Assistant</p>
            <h1 id="screenTitle">Let's validate your information</h1>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" type="button" aria-label="Notifications">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16v-5a6 6 0 0 0-12 0v5l-2 2h16l-2-2Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            </button>
            <button class="profile-button" type="button">AM</button>
          </div>
        </header>

        <section class="progress-wrap" aria-label="Progress">
          <div class="progress-step active" data-step="personal"><span>1</span> Validate</div>
          <div class="progress-step" data-step="context"><span>2</span> Context</div>
          <div class="progress-step" data-step="upload"><span>3</span> Upload</div>
          <div class="progress-step" data-step="assistant"><span>4</span> Assist</div>
          <div class="progress-step" data-step="resources"><span>5</span> Finish</div>
        </section>

        <div id="app" class="screen-host" aria-live="polite"></div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
